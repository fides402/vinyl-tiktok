<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vinyl TikTok</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="video-container" id="video-container">
            <div class="video-wrapper" id="video-wrapper"></div>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>
        
        <div class="overlay" id="overlay">
            <div class="disc-info" id="disc-info">
                <a href="#" target="_blank" class="discogs-link" id="discogs-link">
                    <span class="vinyl-icon">💿</span>
                    <span class="discogs-text">Find on Discogs</span>
                </a>
                <a href="#" target="_blank" class="youtube-link" id="youtube-link">
                    <span class="yt-icon">▶</span>
                    <span>YouTube</span>
                </a>
            </div>
        </div>
        
        <div class="hint" id="hint">Swipe up for next</div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
