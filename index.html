<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>Vinyl TikTok</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <div class="video-container" id="video-container">
            <div class="video-wrapper" id="video-wrapper"></div>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Loading videos...</div>
        </div>
        
        <div class="hint" id="hint">↑ Swipe up</div>
        
        <div class="sidebar">
            <div class="sidebar-item" id="sidebar-discogs">
                <div class="sidebar-icon">💿</div>
                <div class="sidebar-text">Discogs</div>
            </div>
            <div class="sidebar-item" id="sidebar-youtube">
                <div class="sidebar-icon">▶️</div>
                <div class="sidebar-text">YouTube</div>
            </div>
            <div class="sidebar-item" id="sidebar-share">
                <div class="sidebar-icon">↗️</div>
                <div class="sidebar-text">Share</div>
            </div>
        </div>
        
        <div class="bottom-bar">
            <div class="channel-name" id="channel-name"></div>
            <div class="track-name" id="track-name"></div>
            <div class="track-details" id="track-details"></div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
